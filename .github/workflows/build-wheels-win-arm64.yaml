name: build-wheels-win-arm64

on:
  push:
    branches:
      - wheel
    tags:
      - '*'

  workflow_dispatch:

concurrency:
  group: build-wheels-win-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels_win_arm64:
    name: ${{ matrix.python-version }}
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # CPython has native Windows ARM64 builds for 3.11 and later.
        # cp39/cp310 are skipped because actions/setup-python cannot find an
        # arm64 interpreter for them ("The version '3.10' with architecture
        # 'arm64' was not found for Windows Enterprise").
        python-version: ["cp311", "cp312", "cp313", "cp314", "cp315"]

    steps:
      - uses: actions/checkout@v4

      # see https://cibuildwheel.readthedocs.io/en/stable/changelog/
      # for a list of versions
      # No cp38 split here: Windows on ARM has no CPython 3.8 (see above), so
      # cibuildwheel 4.x can be used for every entry in this matrix.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_ARCHS: "ARM64"
          CIBW_BUILD_VERBOSITY: 3
          # No KALDIFST_CMAKE_ARGS with -A ARM64: CMake on windows-11-arm
          # already targets the host architecture (ARM64). Passing -A makes
          # CMake fail with "Generator does not support platform
          # specification" when it picks Ninja.
          # cibuildwheel 4.x runs delvewheel repair by default on Windows.
          # _kaldifst.pyd is self-contained (openfst is linked statically), so
          # there is nothing for delvewheel to bundle and it errors with
          # "Unable to find library: ...". Skip the repair step entirely.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          unzip -l ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}-win-arm64
          path: ./wheelhouse/*.whl

      # A green compile does not prove the wheel imports on ARM64 -- actually
      # install it and exercise the FST API before publishing. Run from outside
      # the source tree so `import kaldifst` resolves to site-packages.
      - name: Smoke test
        shell: bash
        run: |
          python3 -m pip install --force-reinstall ./wheelhouse/*.whl

          cd "$RUNNER_TEMP"

          python3 "$GITHUB_WORKSPACE/scripts/smoke_test.py"

      - name: Publish wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools

          twine upload --skip-existing ./wheelhouse/*.whl

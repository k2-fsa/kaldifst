name: build-wheels-win32

on:
  push:
    branches:
      - wheel
      - wheel-android
    tags:
      - '*'

  workflow_dispatch:

concurrency:
  group: build-wheels-win32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels_win32:
    name: ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["cp38", "cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]

    steps:
      - uses: actions/checkout@v4

      # see https://cibuildwheel.readthedocs.io/en/stable/changelog/
      # for a list of versions

      # CPython 3.8 is EOL and cibuildwheel 4.0 dropped support for building it
      # (cp315 needs 4.x), so the two are split across two build steps.
      - name: Build wheels (cp38)
        if: matrix.python-version == 'cp38'
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ENVIRONMENT: KALDIFST_CMAKE_ARGS="-A Win32"
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "*-win_amd64 cp27-* cp35-*  cp36-* cp37-*"
          CIBW_BUILD_VERBOSITY: 3

      - name: Build wheels
        if: matrix.python-version != 'cp38'
        uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_ENVIRONMENT: KALDIFST_CMAKE_ARGS="-A Win32"
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "*-win_amd64 cp27-* cp35-*  cp36-* cp37-*"
          CIBW_BUILD_VERBOSITY: 3
          # cibuildwheel 4.x runs delvewheel repair by default on Windows.
          # _kaldifst.pyd is self-contained (openfst is linked statically), so
          # there is nothing for delvewheel to bundle and it errors with
          # "Unable to find library: ...". Skip the repair step entirely.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          unzip -l ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools

          twine upload --skip-existing ./wheelhouse/*.whl
